{% extends 'base.html' %}

{% block content %}
    <form method="post">
    {% if session[gameNumber] < 10 and session[balance] > 0 %}
         <a class="action" href="{{ url_for('games.betting')}}">New Hand</a>
        <input type="submit" name="nextHand" value="New hand">
    {% else %}
         <a class="action" href="{{ url_for('games.finalScoring')}}">Get Final Score</a>
    {% endif %}
    </form>
{% endblock %}

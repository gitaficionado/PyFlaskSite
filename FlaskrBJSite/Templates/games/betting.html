{% extends "base.html" %}

{% block header %}
    <h1>Place Your Bet</h1>
{% endblock %}

{% block content %}

    <section class="betting-box">

        <h2>Current Balance: ${{ session.get("Balance", 0) }}</h2>

        <p>
            Hands completed:
            {{ session.get("GameNumber", 0) }} of 10
        </p>

        <form
            action="{{ url_for('games.betting') }}"
            method="post"
            class="betting-form">

            <label for="betting">Betting Amount</label>

            <input
                type="number"
                name="betting"
                id="betting"
                min="1"
                step="1"
                max="{{ session.get('Balance', 0) }}"
                value="{{ request.form.get('betting', '1') }}"
                placeholder="Enter amount"
                required>

            <button type="submit">
                Start Hand
            </button>

        </form>

    </section>

{% endblock %}
